name: The Morning

on:
  schedule:
    # 20:30 UTC. GitHub reliably dispatches this repo's scheduled run ~5h late,
    # so in practice it fires ~01:30 UTC = 07:00 IST. If GitHub ever runs it on
    # time, the edition just lands early (02:00 IST) — the date is computed in
    # IST at run time either way.
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the edition but do not send it'
        type: boolean
        default: false
  push:
    # Manual trigger without the Actions UI: push a tag.
    #   run-dry-<n>  builds the edition and skips the send
    #   run-<n>      builds and sends for real
    tags:
      - 'run-*'

concurrency:
  group: the-morning
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Preflight
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          # Which secrets are required depends on [sender].provider.
          PROVIDER=$(python3 scripts/config.py --get sender.provider)
          echo "Send provider: $PROVIDER"
          missing=""
          [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || missing="$missing CLAUDE_CODE_OAUTH_TOKEN"
          case "$PROVIDER" in
            gmail)
              [ -n "${GMAIL_USER:-}" ]         || missing="$missing GMAIL_USER"
              [ -n "${GMAIL_APP_PASSWORD:-}" ] || missing="$missing GMAIL_APP_PASSWORD" ;;
            resend)
              [ -n "${RESEND_API_KEY:-}" ]     || missing="$missing RESEND_API_KEY"
              [ -n "${RESEND_FROM:-}" ]        || missing="$missing RESEND_FROM(variable)" ;;
            smtp)
              [ -n "${SMTP_USER:-}" ]          || missing="$missing SMTP_USER"
              [ -n "${SMTP_PASSWORD:-}" ]      || missing="$missing SMTP_PASSWORD" ;;
          esac
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          python3 scripts/config.py
          # Fail loudly here rather than half-way through a build.
          python3 scripts/fetch_hn.py --hours 24 --limit 3 > /tmp/hn_probe.json
          python3 -c "import json,sys; d=json.load(open('/tmp/hn_probe.json')); sys.exit(0 if d.get('stories') else 1)" \
            || { echo '::error::Hacker News fetch returned nothing'; exit 1; }
          echo "Preflight OK"

      - name: Build and send today's edition
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Falls back to [reader].email in newsletter.toml.
          RECIPIENT_VAR: ${{ vars.RECIPIENT }}
          DRY_RUN: ${{ (inputs.dry_run || startsWith(github.ref_name, 'run-dry-')) && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          TZNAME=$(python3 scripts/config.py --get newsletter.timezone)
          RECIPIENT="${RECIPIENT_VAR:-$(python3 scripts/config.py --get reader.email)}"
          export RECIPIENT
          TODAY=$(TZ="$TZNAME" date +%F)
          mkdir -p build
          echo "Building edition for $TODAY ($TZNAME) -> $RECIPIENT"

          claude -p "$(cat .github/RUNBOOK_ACTIONS.md)

          Today's edition date is $TODAY ($TZNAME). Send to: $RECIPIENT
          Pass these extra flags to scripts/send_email.py: $DRY_RUN" \
            --model claude-opus-5 \
            --permission-mode bypassPermissions \
            --max-turns 120 \
            --output-format text \
            2>&1 | tee build/agent.log

          # The agent writes <date>.json, or <date>-2.json for a second issue.
          if ! compgen -G "editions/$TODAY*.json" > /dev/null; then
            echo "::error::Agent produced no edition file for $TODAY"
            exit 1
          fi
          echo "Built: $(ls editions/$TODAY*.json)"

      - name: Commit history so tomorrow knows what today used
        # Only skipped for dry runs. A real tag run still has to record what it
        # sent, or tomorrow's duplicate check is blind to it.
        if: ${{ !inputs.dry_run && !startsWith(github.ref_name, 'run-dry-') }}
        run: |
          set -euo pipefail
          git config user.name  "${{ github.actor }}"
          git config user.email "$(python3 scripts/config.py --get reader.email)"
          git add editions state
          if git diff --cached --quiet; then
            echo "::warning::Nothing to commit — history was not updated"
          else
            git commit -m "Issue for $(TZ="$(python3 scripts/config.py --get newsletter.timezone)" date +%F)"
            # A tag build has no branch checked out, so push HEAD at main.
            git push origin HEAD:main || \
              echo "::warning::Push failed; the issue was sent but history is unrecorded"
          fi

      - name: Upload the edition for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edition-${{ github.run_id }}
          path: |
            editions/
            build/
          if-no-files-found: error
          retention-days: 14
