# Packages `norepeat` — the duplicate guard — on its own.
#
# The newsletter itself is not a pip package; it is a repository you fork. But
# the thing that stops it repeating itself is useful to any recurring job that
# produces content, so it is kept separately packageable.
#
# NOT PUBLISHED. `norepeat` on PyPI is an unrelated package by another author,
# so this cannot go out under that name — rename it here before publishing,
# and note there is no release workflow yet either. Today the documented way
# to use it is to copy scripts/norepeat.py, which needs no packaging at all.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "norepeat"
version = "1.0.0"
description = "Stop a recurring job from repeating itself, including when it rewords."
readme = "docs/norepeat.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ojas Phadake" }]
keywords = ["deduplication", "newsletter", "agents", "llm", "cron", "content"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Filters",
]

[project.scripts]
norepeat = "norepeat:main"

[tool.setuptools]
py-modules = ["norepeat"]

[tool.setuptools.package-dir]
"" = "scripts"
