# Morning — the default.
#
# Warm paper and ink, a serif masthead in wide capitals, and numbered section
# rules borrowed from a newspaper's department headings. Every value here is
# also the built-in default, so this file is the reference for what a template
# can change: copy it, rename it, edit the bits you care about.
name = "Morning"
description = "Warm paper and ink, serif masthead, numbered section rules."

[fonts]
serif   = "'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif"
sans    = "-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
heading = "serif"   # serif | sans — the stack headings use
body    = "sans"    # serif | sans — the stack body copy uses

[light]
paper = "#FBF8F3"   # page ground
card  = "#FFFDFA"   # quote card, market panel
ink   = "#23272B"   # headlines and body
soft  = "#6E6A63"   # secondary copy
faint = "#94908A"   # captions, metadata
rule  = "#E6DED1"   # hairlines and borders

[dark]
paper = "#15181B"
card  = "#1C2025"
ink   = "#E9E5DD"
soft  = "#A39E95"
faint = "#7C776F"
rule  = "#31363C"

# One accent per section, as [light, dark]. All seven names must exist.
[accents]
amber  = ["#A8792F", "#DCBA72"]
pine   = ["#2F6B62", "#77B8AE"]
indigo = ["#47527A", "#96A2CC"]
plum   = ["#77496B", "#C293B4"]
clay   = ["#AF5C36", "#E29268"]
moss   = ["#5A6B33", "#AFC17A"]
iris   = ["#5B4B8A", "#A99AD6"]

[market]
up = "#2F7A52"
down = "#B04A3C"
up_dark = "#7FBF9A"
down_dark = "#E08A7C"

[masthead]
size = 36
weight = 400
leading = "1.05"
tracking = ".22em"
transform = "uppercase"
rule = 3              # px of solid rule above the masthead; 0 for none
small_size = 30       # under 620px
small_tracking = ".16em"

[section]
number = true         # the 01, 02, 03 before each heading
bar = 2               # px accent bar under it; 0 for none
size = 12
tracking = ".19em"
transform = "uppercase"

[quote]
style = "card"        # card | rule | plain
mark = true           # the big opening quotation mark
italic = true
size = 21

[body]
size = 15
leading = "1.55"
h1 = 18
h2 = 17
radius = 0            # px corner radius on cards
link_underline = false
